name: proptech

x-logs: &logs
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

networks:
  borde:
  interna:
    internal: true
    ipam:
      config:
        - subnet: 172.28.0.0/24
  # Salida a Internet sólo para el worker (M18): los proveedores de email e
  # IA de cambios posteriores la necesitan. Sin `internal`, y ningún otro
  # servicio está en ella: la base y Redis siguen alcanzables sólo desde
  # `interna`.
  salida_worker:

volumes:
  datos_postgres:
  datos_redis:

services:
  db:
    <<: *logs
    image: postgres:18.6-trixie
    command: ["postgres", "-c", "log_line_prefix=%m [%p] %q%a "]
    restart: unless-stopped
    networks:
      - interna
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?falta POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB:?falta POSTGRES_DB}"
    volumes:
      - datos_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  migraciones:
    <<: *logs
    build:
      context: ../backend
    image: proptech-backend:local
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    networks:
      - interna
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: "${POSTGRES_USER:?falta POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB:?falta POSTGRES_DB}"
    depends_on:
      db:
        condition: service_healthy

  redis:
    <<: *logs
    image: redis:8.10.2-trixie
    # Primer argumento "redis-server" (no "sh -c ..."): así el entrypoint de
    # la imagen baja a usuario redis (uid 999) con gosu; con sh -c correría
    # como root (D1). appendonly: los trabajos sobreviven a un reinicio.
    # noeviction: Redis nunca descarta trabajos para hacer lugar.
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory-policy
      - noeviction
      - --requirepass
      - "${REDIS_PASSWORD:?falta REDIS_PASSWORD}"
    restart: unless-stopped
    networks:
      - interna
    environment:
      # Sólo para que el healthcheck (que corre dentro del contenedor) pueda
      # leer $REDIS_PASSWORD; la contraseña real que arranca redis-server ya
      # quedó fija en el comando de arriba.
      REDIS_PASSWORD: "${REDIS_PASSWORD:?falta REDIS_PASSWORD}"
    volumes:
      - datos_redis:/data
    healthcheck:
      # $$ evita que Compose interpole acá (y lo deje en docker inspect del
      # healthcheck); lo expande el shell del contenedor con su propio entorno.
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    <<: *logs
    build:
      context: ../backend
    image: proptech-backend:local
    restart: unless-stopped
    networks:
      - interna
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: "${POSTGRES_USER:?falta POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB:?falta POSTGRES_DB}"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD:?falta REDIS_PASSWORD}"
      PROPTECH_PARAMETROS: /app/config/parametros.yaml
      # Única IP de la que la API acepta encabezados X-Forwarded-* (D17): la
      # dirección fija de caddy en la red interna, nunca "*" ni una subred
      # entera (si no, cualquier contenedor de la red podría mentir su IP de
      # origen).
      FORWARDED_ALLOW_IPS: "172.28.0.254"
    volumes:
      - ../config:/app/config:ro
    depends_on:
      db:
        condition: service_healthy
      migraciones:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/api/salud', timeout=2)"]
      interval: 5s
      timeout: 5s
      retries: 10

  worker:
    <<: *logs
    build:
      context: ../backend
    image: proptech-backend:local
    command: ["arq", "proptech_worker.ajustes.AjustesDelWorker"]
    restart: unless-stopped
    networks:
      - interna
      - salida_worker
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: "${POSTGRES_USER:?falta POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB:?falta POSTGRES_DB}"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD:?falta REDIS_PASSWORD}"
      PROPTECH_PARAMETROS: /app/config/parametros.yaml
    volumes:
      - ../config:/app/config:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migraciones:
        condition: service_completed_successfully
    healthcheck:
      # El default de ARQ es una hora; sin health_check_interval el chequeo
      # nunca fallaría a tiempo (D2, AjustesDelWorker.health_check_interval=30).
      test: ["CMD", "arq", "--check", "proptech_worker.ajustes.AjustesDelWorker"]
      interval: 5s
      timeout: 5s
      retries: 10

  respaldos:
    <<: *logs
    image: postgres:18.6-trixie
    # La misma imagen que `db` (el pg_dump de la misma versión que el
    # servidor, D9). El usuario del HOST, no el uid 999 de la imagen: los
    # archivos del bind mount quedan del dueño real (PROPTECH_UID/GID).
    user: "${PROPTECH_UID:?falta PROPTECH_UID}:${PROPTECH_GID:?falta PROPTECH_GID}"
    entrypoint: ["/usr/local/bin/respaldar.sh"]
    restart: unless-stopped
    networks:
      - interna
    environment:
      HOME: /tmp
      # Variables estándar de libpq (no las POSTGRES_* de la imagen de
      # Postgres): pg_dump y pg_restore las toman solas, sin flags.
      PGHOST: db
      PGPORT: "5432"
      PGUSER: "${POSTGRES_USER:?falta POSTGRES_USER}"
      PGPASSWORD: "${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD}"
      PGDATABASE: "${POSTGRES_DB:?falta POSTGRES_DB}"
      RESPALDO_INTERVALO_SEGUNDOS: "${RESPALDO_INTERVALO_SEGUNDOS:-86400}"
      RESPALDO_CONSERVAR: "${RESPALDO_CONSERVAR:-14}"
      RESPALDO_LIMITE_SEGUNDOS: "${RESPALDO_LIMITE_SEGUNDOS:-1800}"
    volumes:
      - ./respaldos/respaldar.sh:/usr/local/bin/respaldar.sh:ro
      - "${PROPTECH_DIR_RESPALDOS:?falta PROPTECH_DIR_RESPALDOS}:/respaldos"
    depends_on:
      db:
        condition: service_healthy
      migraciones:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/usr/local/bin/respaldar.sh", "--salud"]
      interval: 30s
      timeout: 10s
      retries: 3
      # El primer backup tarda lo que tarde pg_dump; sin margen, Docker
      # marcaría el servicio como no saludable antes de que termine.
      start_period: 120s

  web:
    <<: *logs
    build:
      context: ../web
    image: proptech-web:local
    restart: unless-stopped
    networks:
      - interna
    environment:
      # No es secreto (D8): el nombre del servicio en la red interna de
      # Compose, fijo.
      PROPTECH_URL_API_INTERNA: http://api:8000
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>{if(!r.ok)throw new Error(r.status)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10

  caddy:
    <<: *logs
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    networks:
      borde:
      interna:
        # Dirección fija (D17): es la que la API acepta en FORWARDED_ALLOW_IPS.
        ipv4_address: 172.28.0.254
    environment:
      PROPTECH_SITIO: "${PROPTECH_SITIO:?falta PROPTECH_SITIO}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
