name: proptech

networks:
  borde:
  interna:
    internal: true

volumes:
  datos_postgres:

services:
  db:
    image: postgres:18.6-trixie
    restart: unless-stopped
    networks:
      - interna
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?falta POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB:?falta POSTGRES_DB}"
    volumes:
      - datos_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?falta POSTGRES_USER} -d ${POSTGRES_DB:?falta POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migraciones:
    build:
      context: ../backend
    image: proptech-backend:local
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    networks:
      - interna
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: "${POSTGRES_USER:?falta POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB:?falta POSTGRES_DB}"
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: ../backend
    image: proptech-backend:local
    restart: unless-stopped
    networks:
      - interna
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: "${POSTGRES_USER:?falta POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB:?falta POSTGRES_DB}"
    depends_on:
      db:
        condition: service_healthy
      migraciones:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/api/salud', timeout=2)"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ../web
    image: proptech-web:local
    restart: unless-stopped
    networks:
      - interna
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>{if(!r.ok)throw new Error(r.status)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10

  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    networks:
      - borde
      - interna
    environment:
      PROPTECH_SITIO: "${PROPTECH_SITIO:?falta PROPTECH_SITIO}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
