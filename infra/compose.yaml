name: proptech

x-logs: &logs
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

networks:
  borde:
  # D10 (cambio 2a): `interna` se parte en dos. `datos` es la única red que
  # alcanza la base y Redis; la web nunca está en ella.
  datos:
    internal: true
  # `aplicacion`: la API, la web y Caddy. La IP fija de Caddy vive acá (antes
  # en `interna`); `FORWARDED_ALLOW_IPS` de la API apunta a esta subred.
  aplicacion:
    internal: true
    ipam:
      config:
        - subnet: 172.28.0.0/24
  # Salida a Internet sólo para el worker (M18): los proveedores de email e
  # IA de cambios posteriores la necesitan. Sin `internal`, y ningún otro
  # servicio está en ella: la base y Redis siguen alcanzables sólo desde
  # `datos`.
  salida_worker:

volumes:
  datos_postgres:
  datos_redis:
  # D2 (tarea 3.1): instance.uuid (y el estado de autosave) sobreviven a
  # un `compose up -d --force-recreate caddy`, en vez de cambiar cada vez
  # (verificado en el stack vivo, tarea 5.3).
  datos_caddy:
  config_caddy:

services:
  db:
    <<: *logs
    image: postgres:18.6-trixie
    command: ["postgres", "-c", "log_line_prefix=%m [%p] %q%a "]
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETUID
      - SETGID
    networks:
      - datos
    environment:
      # El rol de arranque (D1): superusuario de la imagen. Lo recibe sólo
      # este servicio (para que la imagen bootstree el rol) y `migraciones`
      # (de una sola corrida, D2); ningún servicio permanente lo tiene.
      POSTGRES_USER: "${POSTGRES_USER:?falta POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB:?falta POSTGRES_DB}"
    volumes:
      - datos_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  migraciones:
    <<: *logs
    build:
      context: ../backend
    image: proptech-backend:local
    # El paso de roles (D1, D2) antes y después de Alembic: crea y repara
    # proptech_migrador/proptech_app/proptech_respaldo con el rol de arranque,
    # corre las migraciones como proptech_migrador y, después, deja la
    # auditoría del rol de arranque otra vez (D9; sin efecto hasta la 6.1).
    command:
      - sh
      - -c
      - >-
        python -m proptech_core.compartido.roles antes &&
        alembic upgrade head &&
        python -m proptech_core.compartido.roles despues
    restart: "no"
    # D3 (tarea 3.2): imagen propia con `USER proptech` (backend/Dockerfile);
    # nunca arranca como root ni necesita bajar de privilegios, así que no
    # hace falta ninguna capacidad (probado: `cap_drop: [ALL]` sin
    # `cap_add` y el servicio sigue sano).
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    networks:
      - datos
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      # El rol de arranque, para el paso de roles (D2): sólo este servicio
      # (de una sola corrida) y `db` lo tienen.
      POSTGRES_USER: "${POSTGRES_USER:?falta POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB:?falta POSTGRES_DB}"
      # Los tres roles que `roles.py` crea y repara, y con el que corre Alembic.
      POSTGRES_MIGRADOR_USER: "${POSTGRES_MIGRADOR_USER:?falta POSTGRES_MIGRADOR_USER}"
      POSTGRES_MIGRADOR_PASSWORD: "${POSTGRES_MIGRADOR_PASSWORD:?falta POSTGRES_MIGRADOR_PASSWORD}"
      POSTGRES_APP_USER: "${POSTGRES_APP_USER:?falta POSTGRES_APP_USER}"
      POSTGRES_APP_PASSWORD: "${POSTGRES_APP_PASSWORD:?falta POSTGRES_APP_PASSWORD}"
      POSTGRES_RESPALDO_USER: "${POSTGRES_RESPALDO_USER:?falta POSTGRES_RESPALDO_USER}"
      POSTGRES_RESPALDO_PASSWORD: "${POSTGRES_RESPALDO_PASSWORD:?falta POSTGRES_RESPALDO_PASSWORD}"
    depends_on:
      db:
        condition: service_healthy

  redis:
    <<: *logs
    image: redis:8.10.2-trixie
    # Primer argumento "redis-server" (no "sh -c ..."): así el entrypoint de
    # la imagen baja a usuario redis (uid 999) con `setpriv`, no `gosu`
    # (hallazgo real, tarea 3.2: `docker-entrypoint.sh` de esta imagen usa
    # `/usr/bin/setpriv --reuid redis --regid redis --clear-groups`); con
    # sh -c correría como root (D1). appendonly: los trabajos sobreviven a
    # un reinicio. noeviction: Redis nunca descarta trabajos para hacer
    # lugar.
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory-policy
      - noeviction
      - --requirepass
      - "${REDIS_PASSWORD:?falta REDIS_PASSWORD}"
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - SETPCAP
    networks:
      - datos
    environment:
      # Sólo para que el healthcheck (que corre dentro del contenedor) pueda
      # leer $REDIS_PASSWORD; la contraseña real que arranca redis-server ya
      # quedó fija en el comando de arriba.
      REDIS_PASSWORD: "${REDIS_PASSWORD:?falta REDIS_PASSWORD}"
    volumes:
      - datos_redis:/data
    healthcheck:
      # $$ evita que Compose interpole acá (y lo deje en docker inspect del
      # healthcheck); lo expande el shell del contenedor con su propio entorno.
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    <<: *logs
    build:
      context: ../backend
    image: proptech-backend:local
    restart: unless-stopped
    # D3 (tarea 3.2): gemelo de `migraciones` (L-009): `USER proptech`,
    # sin capacidad alguna.
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    networks:
      - datos
      - aplicacion
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      # El rol de la app (D1, D3): sin superusuario, sin BYPASSRLS, sin ser
      # dueño de nada. Nunca POSTGRES_PASSWORD (la del rol de arranque).
      POSTGRES_APP_USER: "${POSTGRES_APP_USER:?falta POSTGRES_APP_USER}"
      POSTGRES_APP_PASSWORD: "${POSTGRES_APP_PASSWORD:?falta POSTGRES_APP_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB:?falta POSTGRES_DB}"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD:?falta REDIS_PASSWORD}"
      PROPTECH_PARAMETROS: /app/config/parametros.yaml
      # Única IP de la que la API acepta encabezados X-Forwarded-* (D17): la
      # dirección fija de Caddy en la red `aplicacion`, nunca "*" ni una
      # subred entera (si no, cualquier contenedor de la red podría mentir
      # su IP de origen).
      FORWARDED_ALLOW_IPS: "172.28.0.254"
      # D1/D6: sin configurar se omiten; una cadena vacía no es una clave.
      CLERK_JWT_KEY:
      CLERK_PARTES_AUTORIZADAS:
      CLERK_EMISOR:
      INVITACIONES_CLAVE_CIFRADO:
      # D18/M14, tarea 7.1: opcionales con default en `Configuracion`
      # (`configuracion.py`); se pasan explícitas acá (con el MISMO default
      # que el código, vía `${VAR:-default}`) para que una sola tabla de
      # variables (README) las documente sin tener que adivinarlas.
      DB_POOL_PRE_PING: "${DB_POOL_PRE_PING:-true}"
      DB_POOL_SIZE: "${DB_POOL_SIZE:-5}"
      DB_POOL_RECYCLE_S: "${DB_POOL_RECYCLE_S:-1800}"
      DB_POOL_TIMEOUT_S: "${DB_POOL_TIMEOUT_S:-5}"
      DB_CONNECT_TIMEOUT_S: "${DB_CONNECT_TIMEOUT_S:-2}"
    volumes:
      - ../config:/app/config:ro
    depends_on:
      db:
        condition: service_healthy
      migraciones:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/api/salud', timeout=2)"]
      interval: 5s
      timeout: 5s
      retries: 10

  worker:
    <<: *logs
    build:
      context: ../backend
    image: proptech-backend:local
    command: ["arq", "proptech_worker.ajustes.AjustesDelWorker"]
    restart: unless-stopped
    # D3 (tarea 3.2): gemelo de la API (L-009), sin capacidad alguna.
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    networks:
      - datos
      - salida_worker
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      # El rol de la app (D1, D3), el mismo que usa la API (gemelos, L-009).
      POSTGRES_APP_USER: "${POSTGRES_APP_USER:?falta POSTGRES_APP_USER}"
      POSTGRES_APP_PASSWORD: "${POSTGRES_APP_PASSWORD:?falta POSTGRES_APP_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB:?falta POSTGRES_DB}"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD:?falta REDIS_PASSWORD}"
      PROPTECH_PARAMETROS: /app/config/parametros.yaml
      # D7: la clave secreta de Clerk vive en worker/web, nunca en la API.
      CLERK_SECRET_KEY:
      PROPTECH_URL_PUBLICA:
      # D18/M14, tarea 7.1: gemelo de la API (L-009), mismos defaults.
      DB_POOL_PRE_PING: "${DB_POOL_PRE_PING:-true}"
      DB_POOL_SIZE: "${DB_POOL_SIZE:-5}"
      DB_POOL_RECYCLE_S: "${DB_POOL_RECYCLE_S:-1800}"
      DB_POOL_TIMEOUT_S: "${DB_POOL_TIMEOUT_S:-5}"
      DB_CONNECT_TIMEOUT_S: "${DB_CONNECT_TIMEOUT_S:-2}"
    volumes:
      - ../config:/app/config:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migraciones:
        condition: service_completed_successfully
    healthcheck:
      # El default de ARQ es una hora; sin health_check_interval el chequeo
      # nunca fallaría a tiempo (D2, AjustesDelWorker.health_check_interval=30).
      test: ["CMD", "arq", "--check", "proptech_worker.ajustes.AjustesDelWorker"]
      interval: 5s
      timeout: 5s
      retries: 10

  respaldos:
    <<: *logs
    image: postgres:18.6-trixie
    # La misma imagen que `db` (el pg_dump de la misma versión que el
    # servidor, D9). El usuario del HOST, no el uid 999 de la imagen: los
    # archivos del bind mount quedan del dueño real (PROPTECH_UID/GID).
    user: "${PROPTECH_UID:?falta PROPTECH_UID}:${PROPTECH_GID:?falta PROPTECH_GID}"
    entrypoint: ["/usr/local/bin/respaldar.sh"]
    restart: unless-stopped
    # D3 (tarea 3.2): `user:` arriba ya lo hace correr como el UID del host
    # desde el arranque (nunca root, nunca gosu/setpriv); no usa el
    # entrypoint de la imagen, sólo el script propio. Probado: sin
    # cap_add, sano en los dos arranques (D14, backup al iniciar).
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    networks:
      - datos
    environment:
      HOME: /tmp
      # Variables estándar de libpq (no las POSTGRES_* de la imagen de
      # Postgres): pg_dump y pg_restore las toman solas, sin flags. El rol
      # de respaldo (D1): BYPASSRLS + pg_read_all_data, sin superusuario;
      # nunca el rol de arranque, que un servicio permanente ya no tiene.
      PGHOST: db
      PGPORT: "5432"
      PGUSER: "${POSTGRES_RESPALDO_USER:?falta POSTGRES_RESPALDO_USER}"
      PGPASSWORD: "${POSTGRES_RESPALDO_PASSWORD:?falta POSTGRES_RESPALDO_PASSWORD}"
      PGDATABASE: "${POSTGRES_DB:?falta POSTGRES_DB}"
      RESPALDO_INTERVALO_SEGUNDOS: "${RESPALDO_INTERVALO_SEGUNDOS:-86400}"
      RESPALDO_CONSERVAR: "${RESPALDO_CONSERVAR:-14}"
      RESPALDO_LIMITE_SEGUNDOS: "${RESPALDO_LIMITE_SEGUNDOS:-1800}"
    volumes:
      - ./respaldos/respaldar.sh:/usr/local/bin/respaldar.sh:ro
      - "${PROPTECH_DIR_RESPALDOS:?falta PROPTECH_DIR_RESPALDOS}:/respaldos"
    depends_on:
      db:
        condition: service_healthy
      migraciones:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/usr/local/bin/respaldar.sh", "--salud"]
      interval: 30s
      timeout: 10s
      retries: 3
      # El primer backup tarda lo que tarde pg_dump; sin margen, Docker
      # marcaría el servicio como no saludable antes de que termine.
      start_period: 120s

  web:
    <<: *logs
    build:
      context: ../web
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}"
    image: proptech-web:local
    restart: unless-stopped
    # D3 (tarea 3.2): imagen propia con `USER proptech` (web/Dockerfile).
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    networks:
      # D10/D-051: la web nunca alcanza `db` ni `redis`; sólo la API, por
      # `aplicacion`.
      - aplicacion
    environment:
      # No es secreto (D8): el nombre del servicio en la red `aplicacion` de
      # Compose, fijo.
      PROPTECH_URL_API_INTERNA: http://api:8000
      CLERK_JWT_KEY:
      CLERK_PARTES_AUTORIZADAS:
      CLERK_SECRET_KEY:
      PROPTECH_URL_PUBLICA:
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)throw new Error(r.status)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10

  caddy:
    <<: *logs
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    # D3: `caddy` se queda root (uid 0, declarado) — con `no-new-privileges`
    # las capacidades de archivo del binario no se aplican (J5 de la
    # revisión de DevOps), así que un `USER` no root no podría bindear el
    # puerto 80/443 sin NET_BIND_SERVICE de todos modos. `cap_drop: [ALL]`
    # le sacaría a root su capacidad implícita para el puerto <1024 (los
    # defaults de Docker ya no están); se la devuelve sólo esa.
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    ports:
      - "80:80"
      - "443:443"
    networks:
      borde:
      aplicacion:
        # Dirección fija (D17): es la que la API acepta en FORWARDED_ALLOW_IPS.
        ipv4_address: 172.28.0.254
    environment:
      PROPTECH_SITIO: "${PROPTECH_SITIO:?falta PROPTECH_SITIO}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - datos_caddy:/data
      - config_caddy:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
