[project]
name = "proptech"
version = "0.1.0"
description = "PropTech backend: proptech_core, proptech_api y proptech_worker"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi>=0.143.0,<0.144.0",
  "uvicorn>=0.54.0,<0.55.0",
  "sqlalchemy>=2.1.4,<2.2.0",
  "alembic>=1.20.0,<1.21.0",
  "psycopg[binary]>=3.3.6,<3.4.0",
  "pydantic>=2.14.0,<2.15.0",
  "pydantic-settings>=2.15.0,<2.16.0",
  "pyyaml>=6.0.3,<7",
  "arq==0.28.0",
  "redis[hiredis]>=5.3.1,<6",
  "pyjwt[crypto]==2.15.1",
  "cryptography==50.0.2",
  "httpx==0.28.1",
  "openpyxl==3.1.5",
  "python-multipart==0.0.32",
]

[dependency-groups]
dev = [
  "ruff==0.16.10",
  "mypy==2.4.0",
  "pytest==9.1.1",
  "testcontainers[postgres]==4.15.0",
  "types-pyyaml==6.0.12.20250915",
  "hypothesis==6.170.11",
  "types-openpyxl==3.1.5.20261017",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/proptech_core", "src/proptech_api", "src/proptech_worker"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S603", "S607"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.params.Depends", "fastapi.File"]

[tool.mypy]
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
xfail_strict = true
markers = [
  "integracion: tests que requieren Docker y PostgreSQL real",
]
# Deuda V3-9 (2a), tarea 4.2: si un test se cuelga (sin dependencia nueva,
# viene con pytest/faulthandler), vuelca la traza de todos los hilos al
# log del CI antes de que el workflow lo corte por `timeout-minutes`
# (tarea 4.3), en vez de dejar sólo el silencio de un trabajo cortado.
faulthandler_timeout = 55
