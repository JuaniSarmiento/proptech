schema: spec-driven

context: |
  Language: es
  All artifacts must be written in es (español rioplatense, sin guiones largos).
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Proyecto: PropTech (koris). Plataforma para administrar edificios en propiedad horizontal en
  Mendoza: liquidación de expensas, cuenta corriente, pagos por comprobante y portal del vecino.
  El MVP arranca por edificios; barrios privados después.

  FUENTE DE VERDAD: la carpeta conocimiento/ del repositorio. Leerla antes de cualquier artefacto:
  - conocimiento/mvp.md: objetivo, usuarios, historias con criterios de aceptación, hitos M1-M3.
  - conocimiento/reglas-de-negocio.md: reglas R01-R41, con estado vigente, propuesta o pendiente;
    cada regla vigente trae sus tests mínimos. Una propuesta sólo entra si se valida.
  - conocimiento/decisiones.md: decisiones D-001 en adelante (sólo se agrega; las corregidas llevan la
    marca en el título) y, al final, las preguntas abiertas con el cambio antes del cual se deciden.
  - conocimiento/glosario.md: nombres del dominio, en español; el código usa estos mismos.
  - conocimiento/roadmap.md: los cambios en orden, con la ficha de cada uno.
  - conocimiento/motor-de-reglas.md: el puerto de políticas y GoRules ZEN (D-064, D-066, D-067, D-080).
  - conocimiento/forma-de-trabajo.md y conocimiento/lecciones.md: cómo se construye cada cambio y lo
    que enseñaron los anteriores (leer lecciones.md entero antes de proponer).
  - conocimiento/proyecto-final.md: fases posteriores al MVP.
  Si un artefacto contradice conocimiento/, gana conocimiento/ o se propone una decisión nueva.

  Stack: Next.js (App Router) + TypeScript; FastAPI + SQLAlchemy + Alembic; PostgreSQL con
  Row-Level Security (SET LOCAL); Redis + worker ARQ; Caddy; Docker Compose en un VPS.
  Arrancar cada propose desde su ficha en conocimiento/roadmap.md.
  Estructura (D-040): backend/src/proptech_core (dominio compartido por módulos: complejos, acceso,
  gastos, liquidacion, cuenta_corriente, pagos, avisos, politicas (el motor de reglas) y compartido),
  proptech_api, proptech_worker; web/; infra/; config/parametros.yaml.

  Reglas no negociables: la plata nunca pasa por PropTech; montos en Decimal desde texto,
  NUMERIC(14,2), texto en JSON, nunca float (R07, D-046); la cuenta corriente sólo agrega movimientos (R08); el
  tenant es la administración y sale del login, nunca del cliente; el edificio es un alcance dentro de
  ella, controlado por rol (R10, D-076); intereses simples (R03); TDD estricto en el
  núcleo financiero; cobros y cuenta corriente son dominio CRITICAL (aprobación humana antes de
  escribir código); nunca secretos ni datos personales reales en el repo (es público).

rules:
  proposal:
    - Citar las historias (HU-...), reglas (R..) y decisiones (D-...) de conocimiento/ que el cambio cubre.
    - "Incluir una sección '## Knowledge Base Impact' que nombre cada archivo de conocimiento/ que el cambio afecta y si necesita REWRITE o APPEND; si no afecta ninguno, escribir 'none' y una línea de por qué."
    - Incluir una sección de qué queda fuera del cambio.
    - Declarar el nivel de gobernanza del cambio (CRITICAL, HIGH, MEDIUM o LOW) y, si es CRITICAL o HIGH, pedir la aprobación de Juani antes de construir.
    - Citar las lecciones de conocimiento/lecciones.md que aplican y cómo las cubre cada tarea.
  tasks:
    - Cada regla de negocio que toque el cambio tiene su tarea de test antes que la de implementación.
    - Tareas chicas, de no más de medio día cada una; un cambio de más de unas veinte tareas se parte.
    - Cada tarea cita el escenario de la spec que cubre.

operations:
  apply:
    guidance:
      - "TDD estricto: ver el test fallar antes de escribir el código que lo hace pasar."
      - No tocar cobros ni cuenta corriente sin aprobación explícita de Juani.
  archive:
    guidance:
      - Actualizar conocimiento/ según la sección Knowledge Base Impact; decisiones nuevas sólo se agregan.
