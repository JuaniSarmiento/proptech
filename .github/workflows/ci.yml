name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    # D5 (tarea 4.3): medido con `gh run view` sobre el CI real: 4m26s,
    # 5m18s, 5m32s y 9m08s en las últimas cuatro corridas (tendencia
    # creciente). 20 min deja margen sin ser tan laxo como para no cortar
    # un cuelgue real. Subido a 30 el 22/10/2026: con el 2b la suite pasó a
    # 11m24s y `canario.sh` la corre entera otra vez, así que 20 cortaba a una
    # corrida verde (run 39783653827). Deuda: que el canario no repita todo.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Instalar dependencias
        working-directory: backend
        run: uv sync --locked
      - name: Lint
        working-directory: backend
        run: uv run ruff check .
      - name: Formato
        working-directory: backend
        run: uv run ruff format --check .
      - name: Tipos
        working-directory: backend
        run: uv run mypy
      - name: Tests (incluye integración contra PostgreSQL real)
        run: bash infra/ci/test-backend.sh
      - name: Canario
        run: bash infra/ci/canario.sh backend

  web:
    runs-on: ubuntu-24.04
    env:
      # E16: inventada, no válida contra Clerk; nunca un secreto real en CI.
      CLERK_SECRET_KEY: sk_test_sin_validez_solo_pruebas
    # D5: medido en menos de 20s en vitest; sumar el navegador real (3.8:
    # `next build` + Chromium) deja un margen bastante más generoso. 15 -> 25 el
    # 26/10/2026: instalar Chromium tardó 10 min y el job llegó a 15:40 (run 40357665108).
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "12.10.1"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Instalar dependencias
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Lint
        working-directory: web
        run: pnpm biome ci
      - name: Tipos
        working-directory: web
        run: pnpm tsc --noEmit
      - name: Tests
        run: bash infra/ci/test-web.sh
      - name: Instalar Chromium (D7, tarea 3.8 - sólo este navegador)
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium
      - name: Tests en el navegador real
        run: bash infra/ci/test-web-navegador.sh
      - name: Canario
        run: bash infra/ci/canario.sh web

  humo:
    runs-on: ubuntu-24.04
    # D5: medido en 1 a 2 min (1m00s a 2m00s en las últimas cuatro corridas).
    timeout-minutes: 15
    env:
      # L-047 (2e): el humo se niega a correr sin proyecto propio y nunca sobre `proptech`.
      PROPTECH_COMPOSE_PROYECTO: proptech-humo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prueba de humo del stack completo
        run: bash infra/ci/humo.sh

  ensayo-roles:
    runs-on: ubuntu-24.04
    # L-043 (2e): el ensayo de roles (restaurar el respaldo, subir a la cabeza, bajar al origen y
    # volver a subir) llevaba semanas sin correr en el CI. 20 min es provisorio: se ajusta con los
    # tiempos del primer run real (D5), no antes.
    timeout-minutes: 20
    env:
      # El script hace `down -v`: su proyecto es propio, nunca `proptech` (L-047).
      PROPTECH_COMPOSE_PROYECTO: proptech-ensayo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Ensayo de roles (respaldo, ciclo de migraciones y origen intacto)
        run: bash infra/ci/ensayo-roles.sh

  shellcheck:
    runs-on: ubuntu-24.04
    # D5: medido en menos de 20s; 5 min de margen.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck sobre los scripts de infra/
        run: |
          # D19/D5 (tarea 4.3): tag Y digest, no sólo el tag (que se puede
          # re-publicar con otro contenido). Digest tomado del registro
          # (`docker manifest inspect koalaman/shellcheck:v0.11.0 -v`,
          # 2026-10-16), nunca de una copia local: la copia local de esta
          # máquina tenía OTRO digest para el mismo tag.
          docker run --rm -v "$GITHUB_WORKSPACE":/repo -w /repo \
            koalaman/shellcheck:v0.11.0@sha256:b9389b73c8f26f710a7171cb7d8848a34a9c1e07a7865e727c9ec4ce99f9a83f \
            $(find infra web/e2e -name '*.sh')

  secretos:
    runs-on: ubuntu-24.04
    # D5: medido en menos de 20s; 5 min de margen.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          # Digest tomado del registro (`docker manifest inspect
          # zricethezav/gitleaks:v8.30.1 -v`, 2026-10-16), nunca de una
          # copia local (misma observación que shellcheck arriba).
          docker run --rm -v "$GITHUB_WORKSPACE":/repo -w /repo \
            zricethezav/gitleaks:v8.30.1@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb \
            git --config /repo/.gitleaks.toml -v .
