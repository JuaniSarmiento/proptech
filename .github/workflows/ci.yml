name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Instalar dependencias
        working-directory: backend
        run: uv sync --locked
      - name: Lint
        working-directory: backend
        run: uv run ruff check .
      - name: Formato
        working-directory: backend
        run: uv run ruff format --check .
      - name: Tipos
        working-directory: backend
        run: uv run mypy
      - name: Tests (incluye integración contra PostgreSQL real)
        run: bash infra/ci/test-backend.sh
      - name: Canario
        run: bash infra/ci/canario.sh backend

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "12.10.1"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Instalar dependencias
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Lint
        working-directory: web
        run: pnpm biome ci
      - name: Tipos
        working-directory: web
        run: pnpm tsc --noEmit
      - name: Tests
        run: bash infra/ci/test-web.sh
      - name: Canario
        run: bash infra/ci/canario.sh web

  humo:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prueba de humo del stack completo
        run: bash infra/ci/humo.sh

  secretos:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE":/repo -w /repo \
            zricethezav/gitleaks:v8.30.1 git --config /repo/.gitleaks.toml -v .
